name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_node_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node_project=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: ${{ steps.detect.outputs.has_node_project == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json') != '' && 'npm' || '' }}

      - name: Install dependencies
        if: ${{ steps.detect.outputs.has_node_project == 'true' }}
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        if: ${{ steps.detect.outputs.has_node_project == 'true' }}
        run: npm run lint --if-present

      - name: Skip lint (no Node project yet)
        if: ${{ steps.detect.outputs.has_node_project != 'true' }}
        run: echo "No package.json found; lint check is marked successful."

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_node_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node_project=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: ${{ steps.detect.outputs.has_node_project == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json') != '' && 'npm' || '' }}

      - name: Install dependencies
        if: ${{ steps.detect.outputs.has_node_project == 'true' }}
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Test
        if: ${{ steps.detect.outputs.has_node_project == 'true' }}
        run: npm test --if-present

      - name: Skip test (no Node project yet)
        if: ${{ steps.detect.outputs.has_node_project != 'true' }}
        run: echo "No package.json found; test check is marked successful."

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_node_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node_project=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: ${{ steps.detect.outputs.has_node_project == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json') != '' && 'npm' || '' }}

      - name: Install dependencies
        if: ${{ steps.detect.outputs.has_node_project == 'true' }}
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        if: ${{ steps.detect.outputs.has_node_project == 'true' }}
        run: npm run build --if-present

      - name: Skip build (no Node project yet)
        if: ${{ steps.detect.outputs.has_node_project != 'true' }}
        run: echo "No package.json found; build check is marked successful."
