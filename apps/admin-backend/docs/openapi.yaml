openapi: "3.0.3"
info:
  title: SawitHub Admin API
  version: "1.0.0"
  description: Internal admin API for SawitHub platform management.
servers:
  - url: /api
paths:
  /admin/auth/login:
    post:
      operationId: adminLogin
      summary: Admin login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/AdminUser"
        "401":
          description: Invalid credentials
  /admin/auth/me:
    get:
      operationId: adminMe
      summary: Get current admin user
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AdminUser"
  /admin/overview:
    get:
      operationId: adminOverview
      summary: Platform overview stats
      tags: [dashboard]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Overview data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewData"
  /admin/users:
    get:
      operationId: adminUsers
      summary: List users
      tags: [users]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUser"
                  total:
                    type: integer
  /admin/system:
    get:
      operationId: adminSystem
      summary: System health and metrics
      tags: [system]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: System info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemData"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AdminUser:
      type: object
      properties:
        user_id:
          type: string
        public_id:
          type: string
        email:
          type: string
        username:
          type: string
        full_name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [user, admin]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OverviewData:
      type: object
      properties:
        total_users:
          type: integer
        active_users:
          type: integer
        total_farms:
          type: integer
        subscribed_users:
          type: integer
    SystemData:
      type: object
      properties:
        status:
          type: string
        uptime:
          type: string
        database:
          type: object
        redis:
          type: object
