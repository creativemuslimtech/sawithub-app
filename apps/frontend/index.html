  <!-- Background here so users never see blank white before JS runs (common on slow mobile). -->
  <body>
    <div id="root">
      <div id="static-boot-hint">
        <p>Memuat SawitHub…</p>
      </div>
    </div>
    <noscript>
      <div class="static-noscript">

    <!-- Avoid automatic cache-cleanup reloads here: some mobile browsers do not
         persist the migration marker reliably, which can trap visitors in a
         reload loop before React mounts. The manual recovery below still lets
         users clear stale Service Workers and Cache Storage if startup fails. -->
    <!-- If React never mounts (stale app cache / blocked chunks), offer SW+cache reset (CSP allows inline script). -->
    <script>
      (function () {
        var HINT_ID = 'static-boot-hint'
        var FAIL_MS = 20000
        var timer = setTimeout(showRecovery, FAIL_MS)
        function cancelTimer() {
          clearTimeout(timer)
        }
        var rootEl = document.getElementById('root')
        if (rootEl && window.MutationObserver) {
          var obs = new MutationObserver(function () {
            if (!document.getElementById(HINT_ID)) {
              cancelTimer()
              obs.disconnect()
            }
          })
          obs.observe(rootEl, { childList: true, subtree: true })
        }
        window.addEventListener(
          'error',
          function (ev) {
            var f = ev && ev.filename
            if (f && (f.indexOf('/assets/') >= 0 || f.indexOf('chunk') >= 0)) {
              cancelTimer()
              showRecovery()
            }
          },
          true
        )
        function showRecovery() {
          var hint = document.getElementById(HINT_ID)
          if (!hint || !hint.isConnected) return
          hint.innerHTML =
            '<div style="max-width:20rem;margin:0 auto;line-height:1.45;font-size:0.9rem;text-align:center;color:rgba(229,231,235,0.95)">' +
            '<p style="margin:0 0 0.75rem">Muat ulang dengan bersihkan penyimpanan situs.</p>' +
            '<p style="margin:0 0 0.75rem"><button type="button" id="pwa-clear-reload" style="width:100%;padding:0.65rem 0.85rem;border-radius:0.65rem;border:none;background:#0a7847;color:#fff;font-weight:700;font-size:0.95rem;cursor:pointer">Bersihkan &amp; muat ulang</button></p>' +
            '<p style="margin:0;opacity:0.75;font-size:0.78rem">Login tetap aman. Jika tetap gagal, coba WiFi lain atau browser lain.</p></div>'
          var btn = document.getElementById('pwa-clear-reload')
          if (!btn) return
          btn.addEventListener('click', function () {
            btn.disabled = true
            btn.textContent = 'Memproses…'
            var chain = Promise.resolve()
            if ('serviceWorker' in navigator) {
              chain = navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister() }))
              })
            }
            chain
              .then(function () {
                if ('caches' in window) {
                  return caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k) }))
                  })
                }
              })
              .catch(function () {})
              .finally(function () {
                location.reload()
              })
          })
        }
      })()
    </script>
