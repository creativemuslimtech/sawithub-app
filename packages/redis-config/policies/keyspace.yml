version: 1
prefix: sawithub:prod
domains:
  - name: auth
    pattern: "sawithub:prod:auth:*"
    owner: backend-auth
    pii_allowed: false
    requires_ttl: true
  - name: ratelimit
    pattern: "sawithub:prod:ratelimit:*"
    owner: backend-middleware
    pii_allowed: false
    requires_ttl: true
  - name: cache
    pattern: "sawithub:prod:cache:*"
    owner: backend-readmodels
    pii_allowed: false
    requires_ttl: true
  - name: queue
    pattern: "sawithub:prod:queue:*"
    owner: backend-worker
    pii_allowed: false
    requires_ttl: true
  - name: presence
    pattern: "sawithub:prod:presence:*"
    owner: backend-presence
    pii_allowed: false
    requires_ttl: true
forbidden_patterns:
  - "*email*"
  - "*phone*"
  - "*password*"
