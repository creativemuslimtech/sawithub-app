version: 1
defaults:
  ttl_required: true
  ttl_max_seconds: 604800
domains:
  auth:
    token_revocation_seconds: 2592000
    session_version_seconds: 2592000
    login_attempt_window_seconds: 900
  ratelimit:
    user_route_window_seconds: 60
    ip_route_window_seconds: 60
  cache:
    dashboard_seconds: 30
    laporan_keuangan_seconds: 60
    admin_aggregate_seconds: 120
  queue:
    pending_job_seconds: 3600
    retry_job_seconds: 86400
    dead_letter_seconds: 604800
  presence:
    online_heartbeat_seconds: 90
    last_seen_shadow_seconds: 300
