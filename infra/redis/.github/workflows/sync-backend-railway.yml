name: Sync Backend Redis Env (Railway)

on:
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: "Reason for sync/redeploy"
        required: true
        default: "Redis policy update"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Validate repository config
        run: bash scripts/validate-config.sh

  sync-railway:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Sync backend Redis env + redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_BACKEND_SERVICE_NAME: ${{ secrets.RAILWAY_BACKEND_SERVICE_NAME }}
          REDIS_ADDR: ${{ secrets.REDIS_ADDR }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_DB: ${{ secrets.REDIS_DB }}
          REDIS_POOL_SIZE: ${{ secrets.REDIS_POOL_SIZE }}
          REDIS_PREFIX: ${{ secrets.REDIS_PREFIX }}
          REDIS_TLS: ${{ secrets.REDIS_TLS }}
          REDIS_FEATURE_RATE_LIMIT: ${{ secrets.REDIS_FEATURE_RATE_LIMIT }}
          REDIS_FEATURE_CACHE: ${{ secrets.REDIS_FEATURE_CACHE }}
          REDIS_FEATURE_SESSIONS: ${{ secrets.REDIS_FEATURE_SESSIONS }}
          REDIS_FEATURE_QUEUE: ${{ secrets.REDIS_FEATURE_QUEUE }}
          REDIS_FEATURE_PRESENCE: ${{ secrets.REDIS_FEATURE_PRESENCE }}
        run: bash scripts/sync-backend-railway-env.sh
