name: SQL Validate

on:
  pull_request:
    branches: [main, staging]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure SQL folders exist
        run: |
          test -d "sawit_hub_db/ddl"
          test -d "sawit_hub_db/dml"
          test -d "sawit_hub_admin_db/ddl"
          test -d "sawit_hub_admin_db/dml"

      - name: Check SQL file extensions
        run: |
          bad=$(find sawit_hub_db sawit_hub_admin_db -type f ! -name "*.sql" ! -name ".dbconfig" ! -path "*/README.md" | wc -l)
          if [ "$bad" -ne 0 ]; then
            echo "Found non-sql files inside sawit_hub_db"
            find sawit_hub_db sawit_hub_admin_db -type f ! -name "*.sql" ! -name ".dbconfig" ! -path "*/README.md"
            exit 1
          fi

      - name: Basic SQL lint
        run: |
          if [ -f "sawit_hub_db/ddl/.dbconfig" ]; then
            grep -qE "(CREATE|ALTER|USE|SET)" "sawit_hub_db/ddl/.dbconfig" || {
              echo "No SQL statement detected in sawit_hub_db/ddl/.dbconfig"
              exit 1
            }
          fi
          if [ -f "sawit_hub_admin_db/ddl/.dbconfig" ]; then
            grep -qE "(CREATE|ALTER|USE|SET)" "sawit_hub_admin_db/ddl/.dbconfig" || {
              echo "No SQL statement detected in sawit_hub_admin_db/ddl/.dbconfig"
              exit 1
            }
          fi
          for f in $(find sawit_hub_db sawit_hub_admin_db -name "*.sql" | sort); do
            grep -qE "(CREATE|ALTER|INSERT|UPDATE|DELETE|USE|GRANT|FLUSH|DROP)" "$f" || {
              echo "No SQL statement detected in $f"
              exit 1
            }
          done

      - name: Validate string DEFAULT literals (DDL hygiene)
        run: |
          python3 scripts/validate_sql_string_defaults.py

      - name: Build PR SQL plan
        id: plan
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          changed_status=$(git diff --name-status "$base_sha" "$head_sha" -- 'sawit_hub_db/**' 'sawit_hub_admin_db/**' | sort || true)
          changed=$(printf "%s\n" "$changed_status" | awk '{print $2}' | sort || true)
          ddl_changed=$(printf "%s\n" "$changed" | grep -E '^(sawit_hub_db|sawit_hub_admin_db)/ddl/' || true)
          dml_changed=$(printf "%s\n" "$changed" | grep -E '^(sawit_hub_db|sawit_hub_admin_db)/dml/.*\.sql$' || true)

          estimated_rows=0
          for f in $dml_changed; do
            [ -f "$f" ] || continue
            insert_rows=$( (grep -Eo "VALUES[[:space:]]*\\(" "$f" || true) | wc -l | tr -d ' ')
            update_rows=$(grep -Eic "^[[:space:]]*UPDATE[[:space:]]+" "$f" || true)
            delete_rows=$(grep -Eic "^[[:space:]]*DELETE[[:space:]]+FROM[[:space:]]+" "$f" || true)
            estimated_rows=$((estimated_rows + insert_rows + update_rows + delete_rows))
          done

          inline_sql_file() {
            local file="$1"
            {
              echo "-- ${file}"
              sed -E '/^--/d; /^\/\*!/d; /^SET /d; /^DROP TABLE IF EXISTS /d; /^$/d' "$file"
              echo ""
            }
          }

          dml_commands=""
          for f in $dml_changed; do
            [ -f "$f" ] || continue
            dml_commands="${dml_commands}\n$(inline_sql_file ${f})"
          done

          ddl_commands=""
          while IFS= read -r row; do
            [ -z "$row" ] && continue
            status=$(printf "%s" "$row" | awk '{print $1}')
            file=$(printf "%s" "$row" | awk '{print $2}')
            [[ "$file" =~ ^(sawit_hub_db|sawit_hub_admin_db)/ddl/ ]] || continue

            if [[ "$file" = "sawit_hub_db/ddl/.dbconfig" || "$file" = "sawit_hub_admin_db/ddl/.dbconfig" ]]; then
              ddl_commands="${ddl_commands}\n$(inline_sql_file ${file})"
              continue
            fi
            [[ "$file" =~ \.sql$ ]] || continue
            table=$(basename "$file" .sql)

            if [ "$status" = "A" ]; then
              ddl_commands="${ddl_commands}\n$(inline_sql_file ${file})"
              continue
            fi

            if [ "$status" = "M" ]; then
              diff_lines=$(git diff -U0 "$base_sha" "$head_sha" -- "$file" | grep -E '^[+-][[:space:]]*`[^`]+`' || true)
              table_header_done=false
              while IFS= read -r dl; do
                [ -z "$dl" ] && continue
                sign=$(printf "%s" "$dl" | cut -c1)
                body=$(printf "%s" "$dl" | sed -E 's/^[+-]\s*//' | sed -E 's/,$//')
                col=$(printf "%s" "$body" | sed -E 's/^`([^`]+)`.*/\1/')
                if printf "%s" "$body" | grep -Eq "^(PRIMARY KEY|UNIQUE KEY|KEY|CONSTRAINT|FOREIGN KEY)"; then
                  continue
                fi
                if [ "$sign" != "+" ] && [ "$sign" != "-" ]; then
                  continue
                fi
                if [ "$table_header_done" = false ]; then
                  if [ -n "$ddl_commands" ]; then
                    ddl_commands="${ddl_commands}\n\n"
                  fi
                  ddl_commands="${ddl_commands}${table}"
                  table_header_done=true
                fi
                if [ "$sign" = "+" ]; then
                  ddl_commands="${ddl_commands}\nALTER TABLE \`${table}\` ADD COLUMN ${body};"
                else
                  ddl_commands="${ddl_commands}\nALTER TABLE \`${table}\` DROP COLUMN \`${col}\`;"
                fi
              done <<< "$diff_lines"
            fi
          done <<< "$changed_status"

          ddl_commands=$(printf "%b\n" "$ddl_commands")
          if [ -z "$(printf '%s' "$ddl_commands" | tr -d '[:space:]')" ]; then
            ddl_commands="# no ddl command generated"
          fi
          dml_commands=$(printf "%b\n" "$dml_commands" | awk 'NF' || true)

          {
            echo "changed<<EOF"
            printf "%s\n" "$changed"
            echo "EOF"
            echo "ddl_changed<<EOF"
            printf "%s\n" "$ddl_changed"
            echo "EOF"
            echo "dml_changed<<EOF"
            printf "%s\n" "$dml_changed"
            echo "EOF"
            echo "estimated_rows=$estimated_rows"
            echo "ddl_commands<<EOF"
            printf "%s\n" "$ddl_commands"
            echo "EOF"
            echo "dml_commands<<EOF"
            printf "%s\n" "$dml_commands"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment SQL execution plan on PR
        uses: actions/github-script@v7
        env:
          PLAN_CHANGED: ${{ steps.plan.outputs.changed }}
          PLAN_DDL_CHANGED: ${{ steps.plan.outputs.ddl_changed }}
          PLAN_DML_CHANGED: ${{ steps.plan.outputs.dml_changed }}
          PLAN_ESTIMATED_ROWS: ${{ steps.plan.outputs.estimated_rows }}
          PLAN_DDL_COMMANDS: ${{ steps.plan.outputs.ddl_commands }}
          PLAN_DML_COMMANDS: ${{ steps.plan.outputs.dml_commands }}
        with:
          script: |
            const changed = (process.env.PLAN_CHANGED || '').trim();
            const ddlChanged = (process.env.PLAN_DDL_CHANGED || '').trim();
            const dmlChanged = (process.env.PLAN_DML_CHANGED || '').trim();
            const estimatedRows = (process.env.PLAN_ESTIMATED_ROWS || '0').trim();
            const ddlCommands = (process.env.PLAN_DDL_COMMANDS || '').trim();
            const dmlCommands = (process.env.PLAN_DML_COMMANDS || '').trim();

            const ddlLines = ddlChanged ? ddlChanged.split('\n').map(f => `- \`${f}\``).join('\n') : '- (none)';
            const dmlLines = dmlChanged ? dmlChanged.split('\n').map(f => `- \`${f}\``).join('\n') : '- (none)';
            const changedLines = changed ? changed.split('\n').map(f => `- \`${f}\``).join('\n') : '- (none)';

            let body = [
              '## SQL Plan (Auto)',
              '',
              '### Changed SQL files',
              changedLines,
              '',
              '### Files included in DDL apply',
              ddlLines,
              '',
              '### Files included in DML apply',
              dmlLines
            ].join('\n');

            if (ddlCommands) {
              body += [
                '',
                '### DDL commands that will run on merge',
                '```bash',
                ddlCommands,
                '```'
              ].join('\n');
            }

            if (dmlCommands) {
              body += [
                '',
                '### DML commands that will run on merge',
                '```bash',
                dmlCommands,
                '```',
                '',
                `### Estimated DML total row changes: **${estimatedRows}**`,
                '',
                '> Estimasi dihitung dari jumlah INSERT VALUES + jumlah statement UPDATE/DELETE pada file DML yang berubah di PR.'
              ].join('\n');
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '## SQL Plan (Auto)';
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
