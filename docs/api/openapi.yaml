# Paths — Dashboard
# ─────────────────────────────────────────────────────────────────────────────
  /api/ReportingDashboardService:
    get:
      tags: [Dashboard]
      summary: Farm dashboard aggregation
      description: |
        Returns the full dashboard payload for the authenticated farmer.
        Results are cached in Redis for **90 seconds** per user per query string.
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [month, week, year]
            default: month
        - name: lahan_id
          in: query
          schema:
            type: string
          description: Filter to a specific plot; empty = all plots
        - name: year
          in: query
          schema:
            type: integer
            example: 2026
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 5
        - name: week
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 4
            example: 0
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'

