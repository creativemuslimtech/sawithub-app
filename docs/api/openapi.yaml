          in: query
          schema:
            type: string
            enum: [month, quarter, year]
        - name: lahan_id
          in: query
          schema:
            type: string
          description: Filter to a specific plot
        - name: year
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Financial report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaporanKeuanganResponse'

