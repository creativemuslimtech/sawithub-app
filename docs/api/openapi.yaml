openapi: 3.0.3
info:
  title: SawitHub API
  description: |
    Complete API specification for SawitHub — palm oil farm management SaaS platform.

    ## Services
    - **Backend** (`:8000`) — User-facing API. All farmer operations.
    - **Admin Backend** (`:8001`) — Internal operations/admin panel.

    ## Authentication
    Both services use **JWT Bearer tokens** issued at login. Pass the token in every
    protected request:
    ```
    Authorization: Bearer <token>
    ```
    Tokens are HMAC-SHA256 signed. User tokens and admin tokens use **separate secrets**
    and are not interchangeable.

    ## Subscription Guards
    Some user endpoints enforce an active subscription. When a guard fails, the
    server returns **402 Payment Required** with `{"error": "..."}`. Trial users
    are further limited:
    - Max **2 farm plots** created
    - Max **2 harvest records** created
    - Financial report returns first **2 detail records** only

    ## Rate Limiting
    Protected user endpoints are limited to **100 requests/minute per user**.
    Exceeding the limit returns **429 Too Many Requests**.

    ## Error Format
    All errors return:
    ```json
    { "error": "human-readable message" }
    ```
  version: 1.0.0
  contact:
    email: bantuan@sawithub.app

servers:
  - url: http://localhost:8000
    description: Local — User Backend
  - url: http://localhost:8001
    description: Local — Admin Backend
  - url: https://backend-sawithub-production.up.railway.app
    description: Production — User Backend
  - url: https://admin-backend-sawithub-production.up.railway.app
    description: Production — Admin Backend

