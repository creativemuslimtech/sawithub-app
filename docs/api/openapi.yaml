      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionStatus'

  /api/BillingSubscriptionService/checkout:
    post:
      tags: [Billing]
      summary: Initiate subscription checkout via Midtrans
      description: Creates a Midtrans Snap transaction and returns the payment URL.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                return_url:
                  type: string
                  format: uri
                  example: "https://sawithub.app/subscription?return=1"
      responses:
        '200':
          description: Checkout payload with payment URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '502':
          description: Midtrans payment gateway error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/BillingSubscriptionService/active-farm:
    put:
      tags: [Billing]
      summary: Set active farm for subscription context
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                farm_id:
                  type: string
                  example: "2"
              required: [farm_id]
      responses:
        '200':
          description: Active farm updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOk'

  /api/BillingPaymentService/transactions:
    get:
      tags: [Billing]
      summary: Get payment transaction history
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Pagination cursor (from previous response's next_cursor)
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentTransaction'
                  next_cursor:
                    type: string
                    nullable: true

  /api/BillingPaymentService/callback:
    post:
      tags: [Billing]
      summary: Midtrans payment webhook callback
      description: |
        Receives payment status notifications from Midtrans. This endpoint is
        **not authenticated** — Midtrans calls it directly.

        **Idempotency:** Uses `t_sawit_hub_payment_events` with a `UNIQUE(provider, event_key)`
        constraint to prevent double-processing of duplicate webhooks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Midtrans notification payload
              properties:
                order_id:
                  type: string
                transaction_status:
                  type: string
                payment_type:
                  type: string
                transaction_id:
                  type: string
                gross_amount:
                  type: string
                fraud_status:
                  type: string
              additionalProperties: true
      responses:
        '200':
          description: Callback processed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid callback payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/BillingPaymentService/mock/callback:
    post:
      tags: [Billing]
      summary: Mock payment callback (non-production only)
      description: Only available when `SUBSCRIPTION_PROVIDER=mock`. Returns 404 in production.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Callback processed
        '404':
          description: Not available in this environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# ─────────────────────────────────────────────────────────────────────────────
# Paths — Notifications
# ─────────────────────────────────────────────────────────────────────────────
  /api/NotificationCenterService:
    get:
      tags: [Notifications]
      summary: List notifications
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
        '503':
          description: Notification service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/NotificationCenterService/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All marked read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOk'
              example:
                message: "semua notifikasi dibaca"

  /api/NotificationCenterService/read:
    delete:
      tags: [Notifications]
      summary: Delete all read notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Read notifications deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOk'
              example:
                message: "notifikasi yang sudah dibaca dihapus"

  /api/NotificationCenterService/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark single notification as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marked read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOk'
              example:
                message: "notifikasi dibaca"
        '400':
          description: Missing notification ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# ─────────────────────────────────────────────────────────────────────────────
# Paths — Admin Auth
# ─────────────────────────────────────────────────────────────────────────────
  /api/admin/auth/login:
    post:
      tags: [AdminAuth]
      summary: Admin login
      description: Authenticates against `sawit_hub_admin_db`. Token validity is 30 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                  description: Admin email, username, or phone
                  example: "admin"
                password:
                  type: string
                  format: password
                  example: "adminpassword"
              required: [identifier, password]
      responses:
        '200':
          description: Admin login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/auth/me:
    get:
      tags: [AdminAuth]
      summary: Get current admin user
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Admin profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserDetail'

  /api/admin/auth/logout:
    post:
      tags: [AdminAuth]
      summary: Admin logout (current session)
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "logout admin berhasil"
                  user_id:
                    type: string

  /api/admin/auth/logout-all:
    post:
      tags: [AdminAuth]
      summary: Admin logout all sessions
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: All admin sessions terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOk'
              example:
                message: "logout semua device admin berhasil"

# ─────────────────────────────────────────────────────────────────────────────
# Paths — Admin Overview
# ─────────────────────────────────────────────────────────────────────────────
  /api/admin/overview:
    get:
      tags: [AdminOverview]
      summary: Admin dashboard overview
      description: Returns platform-wide stats. Cached in Redis for **3 minutes**.
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Platform overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverviewResponse'

# ─────────────────────────────────────────────────────────────────────────────
# Paths — Admin Users
# ─────────────────────────────────────────────────────────────────────────────
  /api/admin/users:
    get:
      tags: [AdminUsers]
      summary: List all users (paginated)
      security:
        - adminBearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number (20 users per page)
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersResponse'

  /api/admin/users/{id}/role:
    put:
      tags: [AdminUsers]
      summary: Change user role
      description: Cannot remove the last active admin account.
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: User's public_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [user, admin]
                  example: "admin"
              required: [role]
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOk'
        '400':
          description: Cannot remove last admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/users/{id}/status:
    put:
      tags: [AdminUsers]
      summary: Toggle user active/inactive status
      description: Cannot deactivate self or the last active admin.
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  is_active:
                    type: boolean

  /api/admin/users/{id}/deactivate:
    put:
      tags: [AdminUsers]
      summary: Deactivate user account
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOk'

  /api/admin/users/{id}/password:
    put:
      tags: [AdminUsers]
      summary: Admin-force change user password
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_password:
                  type: string
                  minLength: 8
                  format: password
                  example: "newpassword123"
                confirm_password:
                  type: string
                  format: password
                  example: "newpassword123"
              required: [new_password, confirm_password]
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOk'
              example:
                message: "Password berhasil diubah"
        '400':
          description: Passwords do not match or too short
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# ─────────────────────────────────────────────────────────────────────────────
# Paths — Admin Data
# ─────────────────────────────────────────────────────────────────────────────
  /api/admin/data:
    get:
      tags: [AdminOverview]
      summary: Browse raw platform data by entity type
      security:
        - adminBearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [panen, lahan, perawatan, pendapatan, kunjungan]
            default: panen
      responses:
        '200':
          description: Data rows for the selected type
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

# ─────────────────────────────────────────────────────────────────────────────
# Paths — Admin Analytics
# ─────────────────────────────────────────────────────────────────────────────
  /api/admin/analytics:
    get:
      tags: [AdminAnalytics]
      summary: Platform analytics (6-month lookback)
      description: |
        Includes user growth, harvest trends, SaaS revenue, and top producers.
        SaaS revenue excludes mock/test transactions.
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Analytics payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalyticsResponse'

# ─────────────────────────────────────────────────────────────────────────────
# Paths — Admin System
# ─────────────────────────────────────────────────────────────────────────────
  /api/admin/system:
    get:
      tags: [AdminSystem]
      summary: System health and API monitoring
      description: Returns DB status, today's metrics, and per-endpoint API observability data.
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSystemResponse'

  /api/admin/system/api-state:
    put:
      tags: [AdminSystem]
      summary: Toggle global API kill-switch
      description: |
        Sets or clears the Redis `api:gate` key. When disabled, all user API
        requests return **503 Service Unavailable** immediately.
        **Requires Redis to be available.**
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_enabled:
                  type: boolean
                  example: false
              required: [api_enabled]
      responses:
        '200':
          description: API state updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "ok"
                  api_enabled:
                    type: boolean
        '503':
          description: Redis unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/system/api-endpoint-state:
    put:
      tags: [AdminSystem]
      summary: Toggle individual endpoint state
      description: |
        Enables or disables a specific route by method + path. The path must
        start with `/api/`. Requires Redis.
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum: [GET, POST, PUT, DELETE, PATCH]
                  example: "POST"
                path:
                  type: string
                  example: "/api/CoreHarvestService"
                enabled:
                  type: boolean
                  example: false
              required: [method, path, enabled]
      responses:
        '200':
          description: Endpoint state updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  method:
                    type: string
                  path:
                    type: string
                  enabled:
                    type: boolean
        '400':
          description: Invalid method or path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Redis unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# ─────────────────────────────────────────────────────────────────────────────
# Paths — Admin Settings
# ─────────────────────────────────────────────────────────────────────────────
  /api/admin/settings:
    get:
      tags: [AdminSettings]
      summary: Get platform settings (theme colours)
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  primary_color:
                    type: string
                    example: "#16a34a"
                  secondary_color:
                    type: string
                    example: "#059669"
                  background_color:
                    type: string
                    example: "#ffffff"

    put:
      tags: [AdminSettings]
      summary: Update platform settings
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                primary_color:
                  type: string
                  example: "#16a34a"
                secondary_color:
                  type: string
                  example: "#059669"
                background_color:
                  type: string
                  example: "#ffffff"
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOk'

# ─────────────────────────────────────────────────────────────────────────────
# Paths — Admin Audit
# ─────────────────────────────────────────────────────────────────────────────
  /api/admin/audit:
    get:
      tags: [AdminAudit]
      summary: Farmer activity audit log
      description: |
        Returns a unified activity log from panen, lahan, perawatan, and user
        registration tables via a UNION query. Soft-deleted records are excluded.
      security:
        - adminBearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number (20 per page)
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [tambah_panen, tambah_lahan, tambah_perawatan, daftar, all]
            default: all
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminAuditLog'
                  page:
                    type: integer
