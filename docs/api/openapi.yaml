# ─────────────────────────────────────────────────────────────────────────────
# Paths — Health
# ─────────────────────────────────────────────────────────────────────────────
paths:
  /health:
    get:
      tags: [Health]
      summary: Simple health check
      description: Returns 200 OK if the database is reachable. No auth required.
      responses:
        '200':
          description: Service healthy
          content:
            text/plain:
              schema:
                type: string
                example: "ok"
        '503':
          description: Database unreachable
          content:
            text/plain:
              schema:
                type: string
                example: "unhealthy: database unreachable"

  /api/health:
    get:
      tags: [Health]
      summary: Detailed health check
      description: Returns database pool stats, Redis health, and queue depths.
      responses:
        '200':
          description: Detailed health payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
                  database:
                    type: object
                    properties:
                      write:
                        type: string
                        example: "connected"
                      read:
                        type: string
                        example: "connected"
                  redis:
                    type: object
                    additionalProperties: true
                  redis_metrics:
                    type: object
                    additionalProperties: true
                  redis_queue:
                    type: object
                    properties:
                      email_depth:
                        type: integer
                        format: int64
                      email_dlq:
                        type: integer
                        format: int64
                  db_stats:
                    type: object
                    properties:
                      write:
                        type: object
                        properties:
                          open_connections:
                            type: integer
                          in_use:
                            type: integer
                          idle:
                            type: integer
                          max_open:
                            type: integer
                      read:
                        type: object
                        additionalProperties: true

# ─────────────────────────────────────────────────────────────────────────────
# Paths — Platform (Public)
# ─────────────────────────────────────────────────────────────────────────────
  /api/PlatformThemeService:
    get:
      tags: [Platform]
      summary: Get platform theme configuration
      description: Returns the current UI theme colours. Cached for 5 minutes (public Cache-Control header).
      responses:
        '200':
          description: Theme config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeConfig'

  /api/PlatformTrafficService:
    post:
      tags: [Platform]
      summary: Record anonymous page visit
      description: Fires and forgets — always returns 204. Used for internal analytics only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                  example: "sess-abc123"
                visitor_id:
                  type: string
                  example: "vis-xyz789"
                device_type:
                  type: string
                  enum: [web, mobile]
                  default: web
                page:
                  type: string
                  example: "/"
      responses:
        '204':
          description: Accepted (async, no body)

  /api/Contact:
    post:
      tags: [Platform]
      summary: Submit contact form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 120
                  example: "Budi Santoso"
                email:
                  type: string
                  format: email
                  maxLength: 120
                  example: "budi@example.com"
                subject:
                  type: string
                  maxLength: 180
                  example: "Pertanyaan tentang koperasi"
                message:
                  type: string
                  maxLength: 5000
                  example: "Apakah ada paket koperasi?"
              required: [name, email, message]
      responses:
        '200':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOk'
              example:
                message: "Pesan berhasil dikirim"
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# ─────────────────────────────────────────────────────────────────────────────
# Paths — Auth (Public)
# ─────────────────────────────────────────────────────────────────────────────
  /api/IdentityAuthService/register:
    post:
      tags: [Auth]
      summary: Register new user account
      description: |
        Creates a new farmer account. Sends a welcome email asynchronously via Asynq.
        Returns 409 if email or username is already taken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  description: Lowercase alphanumeric, stored lowercase
                  example: "pak_suparman"
                email:
                  type: string
                  format: email
                  description: Stored as AES-256 encrypted; looked up via SHA-256 hash
                  example: "petani@example.com"
                password:
                  type: string
                  minLength: 8
                  format: password
                  example: "rahasialagi8"
                full_name:
                  type: string
                  example: "Suparman"
                phone:
                  type: string
                  example: "+628123456789"
              required: [username, email, password]
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email or username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                emailTaken:
                  value:
                    error: "email sudah terdaftar"
                usernameTaken:
                  value:
                    error: "username sudah digunakan"

  /api/IdentityAuthService/login:
    post:
      tags: [Auth]
      summary: Login with email, username, or phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                  description: Email address, username, or phone number
                  example: "pak_suparman"
                password:
                  type: string
                  format: password
                  example: "rahasialagi8"
              required: [identifier, password]
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error: "akun tidak ditemukan"
                wrongPassword:
                  value:
                    error: "password salah"

  /api/IdentityAuthService/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset OTP
      description: |
        Sends a 6-digit OTP to the email address. Always returns 200 to prevent
        email enumeration — even for unknown addresses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "petani@example.com"
              required: [email]
      responses:
        '200':
          description: OTP sent (or silently ignored for unknown emails)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOk'
              example:
                message: "ok"

  /api/IdentityAuthService/verify-reset:
    post:
      tags: [Auth]
      summary: Verify password reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "petani@example.com"
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: "483920"
              required: [email, code]
      responses:
        '200':
          description: OTP verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOk'
        '400':
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/IdentityAuthService/reset-password:
    post:
      tags: [Auth]
      summary: Set new password after OTP verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "petani@example.com"
                code:
                  type: string
                  example: "483920"
                password:
                  type: string
                  minLength: 8
                  format: password
                  example: "passwordbaru123"
              required: [email, code, password]
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOk'
              example:
                message: "password berhasil diubah"
        '400':
          description: Validation error or invalid code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# ─────────────────────────────────────────────────────────────────────────────
# Paths — Auth (Protected)
# ─────────────────────────────────────────────────────────────────────────────
  /api/IdentityAuthService/me:
    get:
      tags: [Profile]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserDetail'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/IdentityAuthService/ping:
    get:
      tags: [Session]
      summary: Presence heartbeat
      description: |
        Updates `last_seen_at` on the user record. The frontend calls this
        every 60 seconds. Returns 204 with no body.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Acknowledged

  /api/IdentityAuthService/update-password:
    put:
      tags: [Profile]
      summary: Change own password
      description: Bumps the session version in Redis, invalidating all other active sessions.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  format: password
                  example: "rahasialagi8"
                new_password:
                  type: string
                  minLength: 8
                  format: password
                  example: "passwordbaru123"
              required: [current_password, new_password]
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOk'
              example:
                message: "password berhasil diubah"
        '401':
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/IdentitySessionService/logout:
    post:
      tags: [Session]
      summary: Logout current session
      description: Revokes the current JWT by JTI in Redis.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "logout berhasil"
                  user_id:
                    type: string

  /api/IdentitySessionService/logout-all:
    post:
      tags: [Session]
      summary: Logout all sessions
      description: Bumps session_version in Redis — all existing tokens are immediately invalid.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All sessions terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOk'
              example:
                message: "logout semua device berhasil"

  /api/IdentityProfileService/update-full-name:
    put:
      tags: [Profile]
      summary: Update full name
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_full_name:
                  type: string
                  minLength: 3
                  example: "Suparman Wijaya"
      responses:
        '200':
          description: Name updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOk'
              example:
                message: "nama lengkap berhasil diubah"
        '400':
          description: Name too short
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/IdentityProfileService/update-email:
    put:
      tags: [Profile]
      summary: Update email address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_email:
                  type: string
                  format: email
                  example: "baru@example.com"
              required: [new_email]
      responses:
        '200':
          description: Email updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOk'
              example:
                message: "email berhasil diubah"
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/IdentityProfileService/update-phone:
    put:
      tags: [Profile]
      summary: Update phone number
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_phone:
                  type: string
                  pattern: '^[0-9+\-\s]{8,15}$'
                  example: "+628987654321"
      responses:
        '200':
          description: Phone updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOk'
              example:
                message: "nomor telepon berhasil diubah"
        '400':
          description: Invalid phone format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/IdentityProfileService/update-username:
    put:
